<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Change password — Civic Ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── Ambient ── */
.pc-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); animation: orb-drift 16s ease-in-out infinite alternate; }
.orb-a { width: 380px; height: 380px; background: radial-gradient(circle, #34D399 0%, transparent 70%); opacity: 0.32; top: -80px; right: -60px; animation-delay: 0s; }
.orb-b { width: 280px; height: 280px; background: radial-gradient(circle, #7C3AED 0%, transparent 70%); opacity: 0.36; bottom: -60px; left: -40px; animation-delay: -6s; }
.orb-c { width: 220px; height: 220px; background: radial-gradient(circle, #0EA5E9 0%, transparent 70%); opacity: 0.25; top: 40%; left: 40%; animation-delay: -11s; animation-duration: 22s; }
@keyframes orb-drift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(20px,-18px) scale(1.06); }
  100% { transform: translate(-14px,14px) scale(0.94); }
}

/* ── Card ── */
.pc-wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 36px 16px 60px; }
.pc-card {
  background: rgba(13,17,36,0.72);
  backdrop-filter: blur(32px) saturate(200%);
  -webkit-backdrop-filter: blur(32px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px; padding: 36px 38px 34px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 1px 0 rgba(255,255,255,0.14) inset;
  position: relative; overflow: hidden;
  animation: card-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes card-enter {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.pc-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 160px;
  background: radial-gradient(ellipse at 50% 0%, rgba(52,211,153,0.12) 0%, transparent 70%);
  pointer-events: none;
}

/* ── Window chrome ── */
.win-chrome { display: flex; align-items: center; gap: 8px; margin-bottom: 26px; }
.win-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.win-dot.red    { background: #FF5F56; }
.win-dot.yellow { background: #FFBD2E; }
.win-dot.green  { background: #27C93F; }
.win-tag { margin-left: 8px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; color: var(--neon-emerald); font-family: 'Public Sans', sans-serif; }
.win-badge { margin-left: auto; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; color: var(--neon-amber); background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); border-radius: 20px; padding: 2px 10px; }

/* ── Security icon ── */
.security-icon {
  width: 58px; height: 58px; margin: 0 0 18px;
  background: linear-gradient(135deg, rgba(52,211,153,0.2), rgba(168,85,247,0.15));
  border: 1px solid rgba(52,211,153,0.35); border-radius: 16px;
  display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
  animation: icon-pop 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes icon-pop {
  from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* ── Input wrap + eye btn ── */
.input-wrap { position: relative; }
.input-wrap input { width: 100%; box-sizing: border-box; padding-right: 42px; }
.eye-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--text-muted); transition: color 0.2s; display: flex; align-items: center;
}
.eye-btn:hover { color: var(--neon-emerald); }

/* ── Password strength ── */
.pw-strength { margin-top: 6px; }
.pw-strength-bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 4px; }
.pw-strength-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.4s ease, background 0.4s ease; }
.pw-strength-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }

/* ── Caps warn ── */
.caps-warn {
  display: none; align-items: center; gap: 6px;
  background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3);
  border-radius: 8px; padding: 6px 10px; margin-top: 6px;
  font-size: 0.75rem; color: #FCD34D; font-weight: 600;
}
.caps-warn.show { display: flex; }

/* ── Requirement checklist ── */
.req-list { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 4px; }
.req-list li { font-size: 0.78rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; transition: color 0.3s; }
.req-list li.ok { color: var(--neon-emerald); }
.req-list li::before { content: '○'; font-size: 0.7rem; }
.req-list li.ok::before { content: '✓'; }

/* ── Field animation ── */
.field { animation: field-in 0.4s ease both; }
.field:nth-child(1) { animation-delay: 0.08s; }
.field:nth-child(2) { animation-delay: 0.16s; }
@keyframes field-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Success ── */
.success-ring {
  width: 72px; height: 72px; margin: 8px auto 18px;
  background: linear-gradient(135deg, rgba(52,211,153,0.25), rgba(56,189,248,0.15));
  border: 1.5px solid rgba(52,211,153,0.5); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
  animation: check-pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  box-shadow: 0 0 30px rgba(52,211,153,0.3);
}
@keyframes check-pop {
  from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* ── Shake ── */
@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-8px); }
  40%    { transform: translateX(8px); }
  60%    { transform: translateX(-5px); }
  80%    { transform: translateX(4px); }
}
.shake-card { animation: shake 0.45s ease !important; }
</style>
</head>
<body>
<div class="pc-scene">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>
<div id="topbar-root"></div>
<main class="shell" style="padding-top:0">
  <div class="pc-wrap">
    <div class="pc-card" id="pc-card">

      <!-- Window chrome -->
      <div class="win-chrome">
        <span class="win-dot red"></span>
        <span class="win-dot yellow"></span>
        <span class="win-dot green"></span>
        <span class="win-tag">SECURITY SETTINGS</span>
        <span class="win-badge">AUTHENTICATED</span>
      </div>

      <div id="pc-body">
        <div class="security-icon">🛡️</div>
        <h1 style="font-size:1.8rem;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800">Change password</h1>
        <p class="meta" style="margin-bottom:22px">Update your credential. Must be at least 12 characters.</p>

        <div id="alert-slot"></div>

        <form id="password-form">
          <div class="field">
            <label for="current-password">Current password</label>
            <div class="input-wrap">
              <input type="password" id="current-password" required autocomplete="current-password" placeholder="Your current password">
              <button type="button" class="eye-btn" id="cur-pw-toggle" tabindex="-1" aria-label="Show current password">
                <svg id="cur-eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="new-password">New password</label>
            <div class="input-wrap">
              <input type="password" id="new-password" required minlength="12" autocomplete="new-password" placeholder="At least 12 characters">
              <button type="button" class="eye-btn" id="new-pw-toggle" tabindex="-1" aria-label="Show new password">
                <svg id="new-eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="pw-strength">
              <div class="pw-strength-bar"><div class="pw-strength-fill" id="pw-fill"></div></div>
              <span class="pw-strength-label" id="pw-label">Enter a password</span>
            </div>
            <ul class="req-list" id="req-list">
              <li id="req-len">12+ characters</li>
              <li id="req-upper">Uppercase letter</li>
              <li id="req-num">Number</li>
              <li id="req-sym">Special character</li>
            </ul>
            <div class="caps-warn" id="caps-warn">⇪ Caps Lock is on</div>
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="submit-btn" style="margin-top:10px">Change password →</button>
        </form>
      </div>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
const user = requireSession();
renderTopbar();

const pcCard    = document.getElementById('pc-card');
const pcBody    = document.getElementById('pc-body');
const alertSlot = document.getElementById('alert-slot');

/* ── Eye button helper ── */
const EYE_OPEN = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
const EYE_SHUT = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

function makeEyeToggle(inputId, toggleId, iconId) {
  const input  = document.getElementById(inputId);
  const toggle = document.getElementById(toggleId);
  const icon   = document.getElementById(iconId);
  toggle.addEventListener('click', () => {
    const showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    icon.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
  });
}
makeEyeToggle('current-password', 'cur-pw-toggle', 'cur-eye-icon');
makeEyeToggle('new-password',     'new-pw-toggle', 'new-eye-icon');

/* ── Password strength + requirements ── */
const newPwInput = document.getElementById('new-password');
const pwFill     = document.getElementById('pw-fill');
const pwLabel    = document.getElementById('pw-label');

function checkStrength(val) {
  const has12    = val.length >= 12;
  const hasUpper = /[A-Z]/.test(val);
  const hasNum   = /[0-9]/.test(val);
  const hasSym   = /[^A-Za-z0-9]/.test(val);

  document.getElementById('req-len').classList.toggle('ok', has12);
  document.getElementById('req-upper').classList.toggle('ok', hasUpper);
  document.getElementById('req-num').classList.toggle('ok', hasNum);
  document.getElementById('req-sym').classList.toggle('ok', hasSym);

  const score = [has12, hasUpper, hasNum, hasSym, val.length >= 16].filter(Boolean).length;
  const levels = [
    { pct: '0%',   color: '#374151', text: 'Enter a password' },
    { pct: '25%',  color: '#EF4444', text: 'Too weak' },
    { pct: '50%',  color: '#F97316', text: 'Weak' },
    { pct: '70%',  color: '#EAB308', text: 'Fair' },
    { pct: '88%',  color: '#22C55E', text: 'Strong' },
    { pct: '100%', color: '#34D399', text: '🔒 Excellent' },
  ];
  const level = val.length === 0 ? levels[0] : levels[Math.min(score, 5)];
  pwFill.style.width = level.pct;
  pwFill.style.background = level.color;
  pwLabel.textContent = level.text;
  pwLabel.style.color = level.color;
}
newPwInput.addEventListener('input', () => checkStrength(newPwInput.value));

/* ── Caps Lock ── */
const capsWarn = document.getElementById('caps-warn');
newPwInput.addEventListener('keyup', e => {
  capsWarn.classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock'));
});

/* ── Form submit ── */
const form = document.getElementById('password-form');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = form.querySelector('button[type=submit]');
  alertSlot.innerHTML = '';
  setButtonBusy(button, true, 'Changing password');
  try {
    const result = await api('POST', '/auth/change-password', {
      current_password: document.getElementById('current-password').value,
      new_password: newPwInput.value,
    });
    clearSession();
    /* Animated success */
    pcBody.style.opacity = '0'; pcBody.style.transform = 'scale(0.95)'; pcBody.style.transition = 'opacity 0.3s, transform 0.3s';
    setTimeout(() => {
      pcBody.innerHTML = `
        <div class="success-ring" style="text-align:center">🛡️</div>
        <h1 style="font-size:1.6rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;margin-bottom:8px;text-align:center">Password changed!</h1>
        <div class="alert alert-success" style="margin-bottom:20px">${escapeHtml(result.message)}</div>
        <a class="btn btn-primary btn-block" href="/login.html">Sign in again →</a>`;
      pcBody.style.opacity = '1'; pcBody.style.transform = 'scale(1)';
    }, 320);
  } catch (err) {
    alertSlot.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    pcCard.classList.add('shake-card');
    pcCard.addEventListener('animationend', () => pcCard.classList.remove('shake-card'), { once: true });
    setButtonBusy(button, false);
  }
});
</script>
</body>
</html>
