<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset password — Civic Ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── Ambient ── */
.fp-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); animation: orb-drift 18s ease-in-out infinite alternate; }
.orb-a { width: 400px; height: 400px; background: radial-gradient(circle, #7C3AED 0%, transparent 70%); opacity: 0.42; top: -100px; right: -60px; animation-delay: 0s; }
.orb-b { width: 300px; height: 300px; background: radial-gradient(circle, #EC4899 0%, transparent 70%); opacity: 0.30; bottom: -80px; left: -40px; animation-delay: -8s; }
@keyframes orb-drift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(25px,-22px) scale(1.07); }
  100% { transform: translate(-18px,18px) scale(0.93); }
}

/* ── Card ── */
.fp-wrap { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; padding: 36px 16px 60px; }
.fp-card {
  background: rgba(13,17,36,0.72);
  backdrop-filter: blur(32px) saturate(200%);
  -webkit-backdrop-filter: blur(32px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px; padding: 36px 38px 34px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 1px 0 rgba(255,255,255,0.14) inset;
  position: relative; overflow: hidden;
  animation: card-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes card-enter {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.fp-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 160px;
  background: radial-gradient(ellipse at 50% 0%, rgba(168,85,247,0.14) 0%, transparent 70%);
  pointer-events: none;
}

/* ── Window chrome ── */
.win-chrome { display: flex; align-items: center; gap: 8px; margin-bottom: 26px; }
.win-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.win-dot.red    { background: #FF5F56; }
.win-dot.yellow { background: #FFBD2E; }
.win-dot.green  { background: #27C93F; }
.win-tag { margin-left: 8px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; color: var(--neon-purple); font-family: 'Public Sans', sans-serif; }
.win-badge { margin-left: auto; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; color: var(--neon-amber); background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); border-radius: 20px; padding: 2px 10px; }

/* ── Recovery icon ── */
.recovery-icon {
  width: 58px; height: 58px; margin: 0 0 18px;
  background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(236,72,153,0.15));
  border: 1px solid rgba(168,85,247,0.35); border-radius: 16px;
  display: flex; align-items: center; justify-content: center; font-size: 1.8rem;
  animation: icon-pop 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes icon-pop {
  from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* ── Input wrap ── */
.input-wrap { position: relative; }
.input-wrap input { width: 100%; box-sizing: border-box; }

/* ── Field animation ── */
.field { animation: field-in 0.4s 0.1s ease both; }
@keyframes field-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Success ── */
.sent-icon {
  width: 72px; height: 72px; margin: 8px auto 18px;
  background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(56,189,248,0.15));
  border: 1.5px solid rgba(168,85,247,0.45); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
  animation: check-pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  box-shadow: 0 0 30px rgba(168,85,247,0.3);
}
@keyframes check-pop {
  from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* ── Shake ── */
@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-8px); }
  40%    { transform: translateX(8px); }
  60%    { transform: translateX(-5px); }
  80%    { transform: translateX(4px); }
}
.shake-card { animation: shake 0.45s ease !important; }

@media (max-width: 480px) {
  .fp-wrap { padding: 14px 8px 48px; }
  .fp-card { padding: 22px 16px 24px; border-radius: 20px; }
  .orb { filter: blur(40px); opacity: 0.35; }
}
</style>
</head>
<body>
<div class="fp-scene">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
</div>
<div id="topbar-root"></div>
<main class="shell" style="padding-top:0">
  <div class="fp-wrap">
    <div class="fp-card" id="fp-card">

      <!-- Window chrome -->
      <div class="win-chrome">
        <span class="win-dot red"></span>
        <span class="win-dot yellow"></span>
        <span class="win-dot green"></span>
        <span class="win-tag">PASSWORD RECOVERY</span>
        <span class="win-badge">SECURE</span>
      </div>

      <div id="fp-body">
        <div class="recovery-icon">🔑</div>
        <h1 style="font-size:1.8rem;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800">Reset password</h1>
        <p class="meta" style="margin-bottom:22px">Enter the email on your account and we'll dispatch a cryptographic reset token.</p>

        <div id="alert-slot"></div>

        <form id="forgot-form">
          <div class="field">
            <label for="email">Institutional email</label>
            <div class="input-wrap">
              <input type="email" id="email" required autocomplete="email" placeholder="name@institution.edu">
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="submit-btn" style="margin-top:8px">Send reset link →</button>
        </form>

        <p class="meta" style="margin-top:22px;padding-top:16px;border-top:1px solid var(--glass-border);text-align:center">
          Remembered credentials? <a href="/login.html" style="color:var(--neon-cyan);font-weight:600">Back to log in →</a>
        </p>
      </div>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
renderTopbar();

const fpCard    = document.getElementById('fp-card');
const fpBody    = document.getElementById('fp-body');
const alertSlot = document.getElementById('alert-slot');

document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  alertSlot.innerHTML = '';
  setButtonBusy(btn, true, 'Sending link');
  try {
    const result = await api('POST', '/auth/forgot-password', { email: document.getElementById('email').value.trim() });

    /* ── Animated success transition ── */
    fpBody.style.opacity = '0';
    fpBody.style.transform = 'scale(0.95)';
    fpBody.style.transition = 'opacity 0.3s, transform 0.3s';
    setTimeout(() => {
      fpBody.innerHTML = `
        <div class="sent-icon">📨</div>
        <h1 style="font-size:1.6rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;margin-bottom:8px">Check your inbox!</h1>
        <p style="color:var(--text-body);margin-bottom:6px">${escapeHtml(result.message)}</p>
        <p style="color:var(--text-dim);font-size:0.82rem;margin-bottom:24px">If you don't see it within a few minutes, check your spam folder.</p>
        <a href="/login.html" class="btn btn-primary" style="display:inline-block;min-width:180px">Back to log in →</a>`;
      fpBody.style.opacity = '1';
      fpBody.style.transform = 'scale(1)';
    }, 320);
  } catch (err) {
    alertSlot.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    fpCard.classList.add('shake-card');
    fpCard.addEventListener('animationend', () => fpCard.classList.remove('shake-card'), { once: true });
    setButtonBusy(btn, false);
  }
});
</script>
</body>
</html>
