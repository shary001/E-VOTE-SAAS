<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manage Election — Civic Ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .stepper {
    display: flex;
    align-items: center;
    background: var(--glass-bg-card);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 24px;
    box-shadow: var(--glass-shadow);
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .stepper::-webkit-scrollbar { display: none; }
  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 130px;
    position: relative;
    opacity: 0.5;
    transition: opacity 160ms ease;
  }
  .step-item.active {
    opacity: 1;
    font-weight: 700;
  }
  .step-item.done {
    opacity: 0.9;
  }
  .step-bubble {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .step-item.active .step-bubble {
    background: var(--neon-purple);
    color: #fff;
    box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
  }
  .step-item.done .step-bubble {
    background: var(--neon-emerald);
    color: #042F2E;
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
  }
  .step-text {
    font-size: 0.85rem;
    line-height: 1.2;
    white-space: nowrap;
    color: var(--text-main);
  }
  .step-line {
    flex: 1;
    height: 2px;
    background: var(--glass-border);
    margin: 0 6px;
    min-width: 12px;
  }
  .step-line.done {
    background: var(--neon-emerald);
  }
  .analytics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  @media (max-width: 860px) {
    .analytics-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="topbar-root"></div>

<main class="shell">
  <div style="margin-bottom: 12px">
    <a href="/orgadmin/dashboard.html" class="meta" style="display:inline-flex;align-items:center;gap:6px">
      &larr; Back to Elections Overview
    </a>
  </div>

  <div id="alert-slot"></div>
  <div id="content"><div class="panel-plain text-center" style="padding:48px 0;color:var(--text-muted)">Loading election details…</div></div>
</main>

<script src="../js/app.js"></script>
<script src="../js/ui.js"></script>
<script>
requireSession(["org_admin"]);
renderTopbar("/orgadmin/dashboard.html");

const alertSlot = document.getElementById("alert-slot");
const electionId = new URLSearchParams(window.location.search).get("id");

if (!electionId) {
  window.location.href = "/orgadmin/dashboard.html";
}

const STAGES = ["draft", "accepting_applications", "voting_open", "closed"];
const STAGE_LABEL = {
  draft: "Draft",
  accepting_applications: "Candidate Applications",
  voting_open: "Voting Open",
  closed: "Voting Closed"
};
const STAGE_DESC = {
  draft: "Election setup and eligibility configuration. Not yet visible for applications.",
  accepting_applications: "Eligible members can submit candidate applications for review.",
  voting_open: "Approved candidates appear on the ballot. Members can cast their vote.",
  closed: "Voting is concluded. Results are ready to be reviewed and published."
};

let currentElection = null;
let currentApplications = [];
let currentAnalytics = null;
let appFilter = "all";
let appSearch = "";

async function load() {
  try {
    const [election, applications, analytics] = await Promise.all([
      api("GET", `/elections/${electionId}`),
      api("GET", `/elections/${electionId}/applications`),
      api("GET", `/elections/${electionId}/analytics`).catch(() => null),
    ]);
    currentElection = election;
    currentApplications = applications;
    currentAnalytics = analytics;
    render();
  } catch (err) {
    document.getElementById("content").innerHTML = `
      <div class="alert alert-error">
        <strong>Error loading election:</strong> ${escapeHtml(err.message)}
      </div>
      <a href="/orgadmin/dashboard.html" class="btn btn-ghost">&larr; Return to dashboard</a>
    `;
  }
}

function render() {
  const election = currentElection;
  const applications = currentApplications;
  const analytics = currentAnalytics;
  const stageIdx = STAGES.indexOf(election.status);
  const nextStage = STAGES[stageIdx + 1];

  const pendingApps = applications.filter(a => a.status === "pending").length;
  const approvedApps = applications.filter(a => a.status === "approved").length;
  const rejectedApps = applications.filter(a => a.status === "rejected").length;

  document.getElementById("content").innerHTML = `
    <!-- Top Header -->
    <div class="page-head" style="align-items:flex-start">
      <div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <span class="badge badge-${statusBadge(election.status)} badge-pulse">
            <span class="badge-dot"></span> ${STAGE_LABEL[election.status]}
          </span>
          <span class="meta">${escapeHtml(election.position_name)}</span>
        </div>
        <h1 style="margin-bottom:6px">${escapeHtml(election.title)}</h1>
        <p class="meta" style="max-width:650px">${escapeHtml(election.description || "No description provided.")}</p>
      </div>
      <div class="page-actions" style="margin-top:6px">
        <button class="btn btn-ghost btn-sm" id="export-apps-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export Applications
        </button>
        ${nextStage ? `
          <button class="btn btn-gold" id="advance-stage-btn">
            Advance to "${STAGE_LABEL[nextStage]}" &rarr;
          </button>
        ` : ""}
        ${election.status === "closed" ? (
          election.results_published ? `
            <button class="btn btn-ghost btn-sm" id="export-results-btn">Export Results (CSV)</button>
            <a class="btn btn-primary" href="/results.html?id=${election.id}">View Public Results &rarr;</a>
          ` : `
            <button class="btn btn-primary" id="publish-results-btn">Publish Results &rarr;</button>
          `
        ) : ""}
        ${election.status !== "voting_open" ? `
          <button class="btn btn-danger btn-sm" id="delete-election-btn">Delete Election</button>
        ` : ""}
      </div>
    </div>

    <!-- Interactive Stepper -->
    <div class="stepper" aria-label="Election Lifecycle Progress">
      ${STAGES.map((s, idx) => {
        const isDone = stageIdx > idx;
        const isActive = stageIdx === idx;
        const cls = isActive ? "active" : (isDone ? "done" : "");
        return `
          <div class="step-item ${cls}">
            <div class="step-bubble">${isDone ? "✓" : (idx + 1)}</div>
            <div class="step-text">
              <strong>${STAGE_LABEL[s]}</strong>
            </div>
          </div>
          ${idx < STAGES.length - 1 ? `<div class="step-line ${isDone ? "done" : ""}"></div>` : ""}
        `;
      }).join("")}
    </div>

    <!-- Quick Stats -->
    <div class="stat-grid" style="margin-bottom:24px">
      <div class="stat">
        <span class="n" id="stat-ballots">${analytics?.ballots_cast ?? 0}</span>
        <span class="label">Ballots Cast</span>
        <span class="subtext">Turnout: ${analytics?.turnout_percentage ?? 0}% of ${analytics?.eligible_voters ?? 0}</span>
      </div>
      <div class="stat">
        <span class="n" id="stat-candidates">${approvedApps}</span>
        <span class="label">Approved Candidates</span>
        <span class="subtext">${applications.length} total application(s)</span>
      </div>
      <div class="stat">
        <span class="n" id="stat-pending" style="${pendingApps > 0 ? 'color:var(--neon-amber)' : ''}">${pendingApps}</span>
        <span class="label">Pending Review</span>
        <span class="subtext">${pendingApps > 0 ? 'Needs attention' : 'All applications reviewed'}</span>
      </div>
      <div class="stat">
        <span class="n" style="font-size:1.4rem;padding-top:8px">${election.results_published ? 'Published' : (election.status === 'closed' ? 'Ready' : 'In Progress')}</span>
        <span class="label">Results Status</span>
        <span class="subtext">${election.results_published ? 'Visible to voters' : 'Hidden from public'}</span>
      </div>
    </div>

    <!-- Analytics & Details Dual Grid -->
    <div class="analytics-grid">
      <!-- Left Column: Timeline & Rules -->
      <div class="panel-plain">
        <h3 style="margin-bottom:14px;display:flex;align-items:center;gap:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Timeline & Schedule
        </h3>
        <table style="min-width:auto;margin-bottom:18px">
          <tr>
            <td class="meta" style="width:140px">Applications:</td>
            <td><strong>${fmtDate(election.application_open_at)}</strong> &rarr; <strong>${fmtDate(election.application_close_at)}</strong></td>
          </tr>
          <tr>
            <td class="meta">Voting Window:</td>
            <td><strong>${fmtDate(election.voting_open_at)}</strong> &rarr; <strong>${fmtDate(election.voting_close_at)}</strong></td>
          </tr>
        </table>

        <h3 style="margin-bottom:14px;display:flex;align-items:center;gap:8px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Eligibility Criteria
        </h3>
        <table style="min-width:auto">
          <tr>
            <td class="meta" style="width:140px">Account Age:</td>
            <td>${election.eligibility_rules?.min_account_age_days ? `${election.eligibility_rules.min_account_age_days} day(s) minimum` : "No minimum age"}</td>
          </tr>
          <tr>
            <td class="meta">Department:</td>
            <td>${(election.eligibility_rules?.allowed_departments || []).length ? (election.eligibility_rules.allowed_departments).join(", ") : "All departments allowed"}</td>
          </tr>
          <tr>
            <td class="meta">Requirements:</td>
            <td>${escapeHtml(election.eligibility_rules?.criteria_text || "Standard organizational membership")}</td>
          </tr>
          <tr>
            <td class="meta">Profile Fields:</td>
            <td>
              <span class="badge ${election.eligibility_rules?.enable_photo ? 'badge-approved' : 'badge-draft'}" style="font-size:0.75rem">Photo: ${election.eligibility_rules?.enable_photo ? 'On' : 'Off'}</span>
              <span class="badge ${election.eligibility_rules?.enable_party ? 'badge-approved' : 'badge-draft'}" style="font-size:0.75rem">Party: ${election.eligibility_rules?.enable_party ? 'On' : 'Off'}</span>
              <span class="badge ${election.eligibility_rules?.enable_manifesto ? 'badge-approved' : 'badge-draft'}" style="font-size:0.75rem">Manifesto: ${election.eligibility_rules?.enable_manifesto ? 'On' : 'Off'}</span>
            </td>
          </tr>
        </table>
      </div>

      <!-- Right Column: Visual Charts -->
      <div class="panel-plain" style="display:flex;flex-direction:column;justify-content:center;align-items:center">
        <h3 style="align-self:flex-start;margin-bottom:16px">Turnout & Applications</h3>
        <div style="display:flex;gap:24px;justify-content:space-around;width:100%;flex-wrap:wrap">
          <div style="text-align:center">
            <canvas id="turnout-chart" width="160" height="160"></canvas>
            <p class="meta" style="margin-top:6px;font-weight:600">Voter Turnout</p>
          </div>
          <div style="text-align:center">
            <canvas id="app-chart" width="160" height="160"></canvas>
            <p class="meta" style="margin-top:6px;font-weight:600">Application Funnel</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Candidate Applications Section -->
    <div class="page-head" style="margin-top:32px;margin-bottom:14px">
      <div>
        <h2 style="margin-bottom:4px">Candidate Applications</h2>
        <p class="meta">Review statements, evaluate eligibility, and approve candidate ballots.</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input type="text" id="app-search" placeholder="Search applicant name or email…" style="max-width:240px;padding:6px 12px;font-size:0.86rem" value="${escapeHtml(appSearch)}">
        <div class="tabs" style="margin-bottom:0;border:none">
          <button type="button" class="tab ${appFilter === 'all' ? 'active' : ''}" data-app-filter="all">All (${applications.length})</button>
          <button type="button" class="tab ${appFilter === 'pending' ? 'active' : ''}" data-app-filter="pending">Pending (${pendingApps})</button>
          <button type="button" class="tab ${appFilter === 'approved' ? 'active' : ''}" data-app-filter="approved">Approved (${approvedApps})</button>
          <button type="button" class="tab ${appFilter === 'rejected' ? 'active' : ''}" data-app-filter="rejected">Rejected (${rejectedApps})</button>
        </div>
      </div>
    </div>

    <!-- Applications Table -->
    <div class="table-wrap panel-plain">
      <table>
        <thead>
          <tr>
            <th>Applicant</th>
            <th>Statement</th>
            <th>Submitted</th>
            <th>Status</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="applications-tbody">
          ${renderApplicationsList(applications)}
        </tbody>
      </table>
    </div>
  `;

  // Draw Charts
  setTimeout(() => {
    if (analytics) {
      renderTurnoutGauge("turnout-chart", {
        percentage: analytics.turnout_percentage || 0,
        label: "Turnout",
      });
    }

    renderDonutChart("app-chart", {
      labels: ["Approved", "Pending", "Rejected"],
      data: [approvedApps, pendingApps, rejectedApps],
      colors: ["#34D399", "#F59E0B", "#F87171"],
      centerText: String(applications.length),
      centerSubtext: "Applicants",
    });
  }, 50);

  // Bind Event Listeners
  bindEvents(nextStage);
}

function renderApplicationsList(applications) {
  const filtered = applications.filter(a => {
    if (appFilter !== "all" && a.status !== appFilter) return false;
    if (appSearch) {
      const q = appSearch.toLowerCase();
      const name = (a.applicant_name || "").toLowerCase();
      const email = (a.applicant_email || "").toLowerCase();
      if (!name.includes(q) && !email.includes(q)) return false;
    }
    return true;
  });

  if (!filtered.length) {
    return `<tr><td colspan="5" class="empty-state">No candidate applications match this filter.</td></tr>`;
  }

  return filtered.map(a => `
    <tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          ${a.photo_url ? `<img src="${escapeHtml(a.photo_url)}" alt="photo" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--glass-border);flex-shrink:0" onerror="this.style.display='none'">` : ''}
          <div>
            <strong>${escapeHtml(a.applicant_name)}</strong>
            ${(a.party_name || a.party_symbol_url) ? `
              <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
                ${a.party_symbol_url ? `<img src="${escapeHtml(a.party_symbol_url)}" style="width:14px;height:14px;border-radius:2px;object-fit:contain" onerror="this.style.display='none'">` : ''}
                ${a.party_name ? `<span style="font-size:0.75rem;font-weight:700;color:var(--neon-amber)">${escapeHtml(a.party_name)}</span>` : ''}
              </div>
            ` : ''}
            <small class="meta" style="display:block">${escapeHtml(a.applicant_email)}</small>
          </div>
        </div>
      </td>
      <td style="max-width:340px">
        <div style="font-size:0.9rem;line-height:1.4">
          ${escapeHtml(a.statement || "—")}
        </div>
        ${a.manifesto ? `
          <details style="margin-top:6px;font-size:0.82rem;color:var(--neon-cyan)">
            <summary style="cursor:pointer;font-weight:600">View Manifesto</summary>
            <div style="margin-top:4px;padding:8px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-body);white-space:pre-wrap;line-height:1.5">${escapeHtml(a.manifesto)}</div>
          </details>
        ` : ''}
      </td>
      <td class="meta">${fmtDate(a.applied_at)}</td>
      <td>
        <span class="badge badge-${a.status}">${a.status}</span>
        ${a.review_note ? `<br><small class="meta" style="font-style:italic">Note: "${escapeHtml(a.review_note)}"</small>` : ""}
      </td>
      <td style="text-align:right">
        ${a.status === "pending" ? `
          <button class="btn btn-sm btn-primary" data-action="approve" data-id="${a.id}" data-name="${escapeHtml(a.applicant_name)}">Approve</button>
          <button class="btn btn-sm btn-danger" data-action="reject" data-id="${a.id}" data-name="${escapeHtml(a.applicant_name)}">Reject</button>
        ` : `
          <span class="meta">${a.reviewed_at ? fmtDate(a.reviewed_at) : "Reviewed"}</span>
        `}
      </td>
    </tr>
  `).join("");
}

function bindEvents(nextStage) {
  // Advance stage modal
  const advanceBtn = document.getElementById("advance-stage-btn");
  if (advanceBtn && nextStage) {
    advanceBtn.addEventListener("click", () => {
      showModal({
        title: `Advance Election to "${STAGE_LABEL[nextStage]}"?`,
        bodyHtml: `
          <p>Are you sure you want to transition <strong>${escapeHtml(currentElection.title)}</strong>?</p>
          <div class="panel-plain" style="margin:14px 0">
            <strong>Next Stage: ${STAGE_LABEL[nextStage]}</strong>
            <p class="meta" style="margin-top:4px">${STAGE_DESC[nextStage]}</p>
          </div>
          <p class="meta"><em>Note: Stage advancement moves forward sequentially.</em></p>
        `,
        confirmText: `Advance Stage`,
        onConfirm: async () => {
          try {
            await api("PATCH", `/elections/${electionId}/status`, { status: nextStage });
            showToast(`Election advanced to ${STAGE_LABEL[nextStage]}`, "success");
            load();
          } catch (err) {
            showToast(err.message, "error");
          }
        }
      });
    });
  }

  // Publish results modal
  const publishBtn = document.getElementById("publish-results-btn");
  if (publishBtn) {
    publishBtn.addEventListener("click", () => {
      showModal({
        title: "Publish Election Results?",
        bodyHtml: `
          <p>Publishing will make vote tallies and winner standings visible to all members and candidates of your organization.</p>
          <div class="alert alert-success" style="margin:14px 0">
            Ballots cast: <strong>${currentAnalytics?.ballots_cast ?? 0}</strong>
          </div>
        `,
        confirmText: "Publish Now",
        onConfirm: async () => {
          try {
            await api("PATCH", `/elections/${electionId}/publish-results`, {});
            showToast("Results published successfully!", "success");
            load();
          } catch (err) {
            showToast(err.message, "error");
          }
        }
      });
    });
  }

  // Export applications CSV
  const exportAppsBtn = document.getElementById("export-apps-btn");
  if (exportAppsBtn) {
    exportAppsBtn.addEventListener("click", async () => {
      try {
        showToast("Downloading candidate applications CSV…", "info");
        await downloadAuthFile(`/elections/${electionId}/export/applications`, `applications-${electionId}.csv`);
        showToast("Applications CSV downloaded!", "success");
      } catch (err) {
        showToast(err.message, "error");
      }
    });
  }

  // Export results CSV
  const exportResultsBtn = document.getElementById("export-results-btn");
  if (exportResultsBtn) {
    exportResultsBtn.addEventListener("click", async () => {
      try {
        showToast("Downloading election results CSV…", "info");
        await downloadAuthFile(`/elections/${electionId}/export/results`, `results-${electionId}.csv`);
        showToast("Results CSV downloaded!", "success");
      } catch (err) {
        showToast(err.message, "error");
      }
    });
  }

  // Delete Election handler
  const deleteElecBtn = document.getElementById("delete-election-btn");
  if (deleteElecBtn) {
    deleteElecBtn.addEventListener("click", () => {
      showModal({
        title: "Delete Election",
        bodyHtml: `
          <div class="alert alert-error" style="margin-bottom:14px">
            <strong>Warning:</strong> You are about to permanently delete <strong>${escapeHtml(currentElection.title)}</strong>.
          </div>
          <p class="meta">All candidate applications and associated ballot records will be removed. This cannot be undone.</p>
        `,
        confirmText: "Delete Election",
        onConfirm: async () => {
          try {
            await api("DELETE", `/elections/${electionId}`);
            showToast(`Election "${currentElection.title}" deleted.`, "success");
            window.location.href = "/orgadmin/dashboard.html";
          } catch (err) {
            showToast(err.message, "error");
          }
        }
      });
    });
  }

  // Approve / Reject actions
  document.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const action = btn.dataset.action;
      const appId = btn.dataset.id;
      const applicantName = btn.dataset.name;

      if (action === "approve") {
        showModal({
          title: `Approve Candidate: ${applicantName}`,
          bodyHtml: `
            <p>Are you sure you want to approve <strong>${escapeHtml(applicantName)}</strong>?</p>
            <p class="meta">This candidate will appear on the final ballot and will be notified via email.</p>
          `,
          confirmText: "Confirm Approval",
          onConfirm: async () => {
            try {
              await api("PATCH", `/applications/${appId}/decision`, { status: "approved" });
              showToast(`Candidate ${applicantName} approved!`, "success");
              load();
            } catch (err) {
              showToast(err.message, "error");
            }
          }
        });
      } else if (action === "reject") {
        showModal({
          title: `Reject Application: ${applicantName}`,
          bodyHtml: `
            <p>Provide a constructive reason for rejecting <strong>${escapeHtml(applicantName)}</strong>'s application:</p>
            <div class="field" style="margin:12px 0">
              <label for="reject-reason">Feedback note (sent to applicant)</label>
              <textarea id="reject-reason" placeholder="e.g. Does not meet minimum credit requirement." style="width:100%"></textarea>
            </div>
          `,
          confirmText: "Reject Application",
          isDanger: true,
          onConfirm: async () => {
            const reason = document.getElementById("reject-reason")?.value.trim() || "";
            try {
              await api("PATCH", `/applications/${appId}/decision`, { status: "rejected", review_note: reason });
              showToast(`Application for ${applicantName} marked as rejected.`, "info");
              load();
            } catch (err) {
              showToast(err.message, "error");
            }
          }
        });
      }
    });
  });

  // Filter tabs
  document.querySelectorAll("[data-app-filter]").forEach(tab => {
    tab.addEventListener("click", () => {
      appFilter = tab.dataset.appFilter;
      document.querySelectorAll("[data-app-filter]").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("applications-tbody").innerHTML = renderApplicationsList(currentApplications);
      bindTableActionButtons();
    });
  });

  // Search input
  const searchInput = document.getElementById("app-search");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      appSearch = e.target.value.trim();
      document.getElementById("applications-tbody").innerHTML = renderApplicationsList(currentApplications);
      bindTableActionButtons();
    });
  }
}

function bindTableActionButtons() {
  document.querySelectorAll("#applications-tbody [data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const action = btn.dataset.action;
      const appId = btn.dataset.id;
      const applicantName = btn.dataset.name;

      if (action === "approve") {
        showModal({
          title: `Approve Candidate: ${applicantName}`,
          bodyHtml: `<p>Approve <strong>${escapeHtml(applicantName)}</strong> for the ballot?</p>`,
          confirmText: "Approve",
          onConfirm: async () => {
            try {
              await api("PATCH", `/applications/${appId}/decision`, { status: "approved" });
              showToast(`Candidate approved!`, "success");
              load();
            } catch (err) {
              showToast(err.message, "error");
            }
          }
        });
      } else if (action === "reject") {
        showModal({
          title: `Reject Application: ${applicantName}`,
          bodyHtml: `
            <div class="field">
              <label for="reject-reason-2">Reason (sent to candidate):</label>
              <textarea id="reject-reason-2" placeholder="e.g. Does not meet department criteria."></textarea>
            </div>
          `,
          confirmText: "Reject",
          isDanger: true,
          onConfirm: async () => {
            const note = document.getElementById("reject-reason-2")?.value.trim() || "";
            try {
              await api("PATCH", `/applications/${appId}/decision`, { status: "rejected", review_note: note });
              showToast(`Application rejected.`, "info");
              load();
            } catch (err) {
              showToast(err.message, "error");
            }
          }
        });
      }
    });
  });
}

function statusBadge(s) {
  return { draft: "draft", accepting_applications: "pending", voting_open: "open", closed: "closed" }[s] || "draft";
}

load();
</script>
</body>
</html>
