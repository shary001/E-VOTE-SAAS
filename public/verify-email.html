<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify email — Civic Ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* ── Ambient ── */
.vfy-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); animation: orb-drift 16s ease-in-out infinite alternate; }
.orb-a { width: 380px; height: 380px; background: radial-gradient(circle, #34D399 0%, transparent 70%); opacity: 0.35; top: -100px; right: -80px; animation-delay: 0s; }
.orb-b { width: 300px; height: 300px; background: radial-gradient(circle, #7C3AED 0%, transparent 70%); opacity: 0.40; bottom: -60px; left: -60px; animation-delay: -7s; }
@keyframes orb-drift {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(20px,-20px) scale(1.06); }
  100% { transform: translate(-15px,15px) scale(0.94); }
}

/* ── Card ── */
.vfy-wrap { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 36px 16px 60px; }
.vfy-card {
  background: rgba(13,17,36,0.72);
  backdrop-filter: blur(32px) saturate(200%);
  -webkit-backdrop-filter: blur(32px) saturate(200%);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px; padding: 36px 38px 34px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04) inset, 0 1px 0 rgba(255,255,255,0.14) inset;
  position: relative; overflow: hidden;
  animation: card-enter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes card-enter {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.vfy-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 160px;
  background: radial-gradient(ellipse at 50% 0%, rgba(52,211,153,0.14) 0%, transparent 70%);
  pointer-events: none;
}

/* ── Window chrome ── */
.win-chrome { display: flex; align-items: center; gap: 8px; margin-bottom: 26px; }
.win-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.win-dot.red    { background: #FF5F56; }
.win-dot.yellow { background: #FFBD2E; }
.win-dot.green  { background: #27C93F; }
.win-tag { margin-left: 8px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.12em; color: var(--neon-emerald); font-family: 'Public Sans', sans-serif; }
.win-badge { margin-left: auto; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; color: var(--neon-cyan); background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25); border-radius: 20px; padding: 2px 10px; }

/* ── Icon ── */
.verify-icon {
  width: 64px; height: 64px; margin: 0 auto 18px;
  background: linear-gradient(135deg, rgba(52,211,153,0.2), rgba(56,189,248,0.2));
  border: 1px solid rgba(52,211,153,0.35); border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  animation: icon-pop 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes icon-pop {
  from { opacity: 0; transform: scale(0.5); }
  to   { opacity: 1; transform: scale(1); }
}

/* ── OTP boxes ── */
.otp-row {
  display: flex; gap: 10px; justify-content: center;
  margin: 24px 0;
}
.otp-box {
  width: 48px; height: 58px;
  background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.14);
  border-radius: 12px; text-align: center;
  font-size: 1.5rem; font-weight: 700; color: var(--text-white);
  font-family: 'Plus Jakarta Sans', 'Public Sans', monospace;
  caret-color: var(--neon-emerald);
  transition: border-color 0.25s, box-shadow 0.25s, transform 0.15s;
  outline: none; appearance: none;
  animation: box-in 0.35s ease both;
}
.otp-box:nth-child(1) { animation-delay: 0.10s; }
.otp-box:nth-child(2) { animation-delay: 0.15s; }
.otp-box:nth-child(3) { animation-delay: 0.20s; }
.otp-box:nth-child(4) { animation-delay: 0.25s; }
.otp-box:nth-child(5) { animation-delay: 0.30s; }
.otp-box:nth-child(6) { animation-delay: 0.35s; }
@keyframes box-in {
  from { opacity: 0; transform: translateY(14px) scale(0.85); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.otp-box:focus {
  border-color: var(--neon-emerald);
  box-shadow: 0 0 0 3px rgba(52,211,153,0.2), 0 0 20px rgba(52,211,153,0.12);
  transform: translateY(-2px);
}
.otp-box.filled {
  border-color: rgba(52,211,153,0.5);
  background: rgba(52,211,153,0.07);
}
.otp-box.error {
  border-color: var(--neon-pink) !important;
  box-shadow: 0 0 0 3px rgba(236,72,153,0.2) !important;
  animation: box-shake 0.35s ease !important;
}
@keyframes box-shake {
  0%,100% { transform: translateX(0); }
  25%      { transform: translateX(-5px); }
  75%      { transform: translateX(5px); }
}

/* ── Success state ── */
.success-checkmark {
  width: 72px; height: 72px; margin: 16px auto 20px;
  background: linear-gradient(135deg, rgba(52,211,153,0.25), rgba(56,189,248,0.15));
  border: 1.5px solid rgba(52,211,153,0.5); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 2.2rem;
  animation: check-pop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  box-shadow: 0 0 30px rgba(52,211,153,0.3);
}
@keyframes check-pop {
  from { opacity: 0; transform: scale(0.3) rotate(-20deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

/* ── Resend countdown ── */
.resend-row { text-align: center; margin-top: 14px; }
.resend-btn {
  background: none; border: none; cursor: pointer;
  color: var(--neon-cyan); font-weight: 600; font-size: 0.85rem;
  transition: opacity 0.2s; font-family: 'Plus Jakarta Sans', sans-serif;
}
.resend-btn:disabled { color: var(--text-muted); cursor: default; }

@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-8px); }
  40%    { transform: translateX(8px); }
  60%    { transform: translateX(-5px); }
  80%    { transform: translateX(4px); }
}
.shake-card { animation: shake 0.45s ease !important; }
</style>
</head>
<body>
<div class="vfy-scene">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
</div>
<div id="topbar-root"></div>
<main class="shell" style="padding-top:0">
  <div class="vfy-wrap">
    <div class="vfy-card" id="vfy-card">

      <!-- Window chrome -->
      <div class="win-chrome">
        <span class="win-dot red"></span>
        <span class="win-dot yellow"></span>
        <span class="win-dot green"></span>
        <span class="win-tag">EMAIL VERIFICATION</span>
        <span class="win-badge">OTP</span>
      </div>

      <div id="content" style="text-align:center">
        <div class="verify-icon">✉️</div>
        <h1 style="font-size:1.75rem;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800">Verify your email</h1>
        <p class="meta" style="margin-bottom:4px">Enter the six-digit code sent to your inbox.</p>
        <p class="meta" style="margin-bottom:0;font-size:0.78rem;color:var(--text-dim)">Expires in 15 minutes.</p>

        <form id="verify-form" style="text-align:left;margin-top:20px">
          <div class="field" style="animation: field-in 0.4s 0.05s ease both">
            <label for="email" style="text-align:left;display:block">Institutional email</label>
            <input type="email" id="email" required autocomplete="email" placeholder="name@institution.edu">
          </div>

          <label style="display:block;text-align:left;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:4px">Verification code</label>
          <div class="otp-row" id="otp-row">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="one-time-code" data-idx="0">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-idx="1">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-idx="2">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-idx="3">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-idx="4">
            <input class="otp-box" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" data-idx="5">
          </div>

          <div id="alert-slot" style="margin-bottom:10px"></div>
          <button class="btn btn-primary btn-block" type="submit" id="verify-btn">Verify email →</button>
        </form>

        <div class="resend-row">
          <button class="resend-btn" id="resend-btn" disabled>Resend code in <span id="countdown">30</span>s</button>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
renderTopbar();
const params    = new URLSearchParams(window.location.search);
const token     = params.get('token');
const content   = document.getElementById('content');
const emailField = document.getElementById('email');
const vfyCard   = document.getElementById('vfy-card');

if (params.get('email')) emailField.value = params.get('email');

/* ── OTP boxes auto-advance ── */
const boxes = Array.from(document.querySelectorAll('.otp-box'));

boxes.forEach((box, i) => {
  box.addEventListener('input', e => {
    const v = e.target.value.replace(/\D/g, '');
    box.value = v ? v[v.length - 1] : '';
    box.classList.toggle('filled', !!box.value);
    if (box.value && i < 5) boxes[i + 1].focus();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      boxes[i - 1].value = '';
      boxes[i - 1].classList.remove('filled');
      boxes[i - 1].focus();
    }
    if (e.key === 'ArrowLeft' && i > 0)  boxes[i - 1].focus();
    if (e.key === 'ArrowRight' && i < 5) boxes[i + 1].focus();
  });
  box.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    text.split('').slice(0, 6).forEach((ch, j) => {
      if (boxes[j]) { boxes[j].value = ch; boxes[j].classList.add('filled'); }
    });
    boxes[Math.min(text.length, 5)].focus();
  });
});

function getCode() { return boxes.map(b => b.value).join(''); }

function shakeBoxes() {
  boxes.forEach(b => {
    b.classList.add('error');
    b.addEventListener('animationend', () => b.classList.remove('error'), { once: true });
  });
  vfyCard.classList.add('shake-card');
  vfyCard.addEventListener('animationend', () => vfyCard.classList.remove('shake-card'), { once: true });
}

/* ── Resend countdown ── */
const resendBtn = document.getElementById('resend-btn');
const cdSpan    = document.getElementById('countdown');
let cdSecs = 30;
const cdInterval = setInterval(() => {
  cdSecs--;
  if (cdSecs <= 0) {
    clearInterval(cdInterval);
    resendBtn.disabled = false;
    resendBtn.textContent = 'Resend code';
  } else {
    cdSpan.textContent = cdSecs;
  }
}, 1000);

/* ── Success state ── */
function showVerified() {
  content.style.opacity = '0';
  content.style.transform = 'scale(0.95)';
  content.style.transition = 'opacity 0.3s, transform 0.3s';
  setTimeout(() => {
    content.innerHTML = `
      <div class="success-checkmark">✅</div>
      <h1 style="font-size:1.5rem;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;margin-bottom:8px">Email verified!</h1>
      <p style="color:var(--text-body);margin-bottom:24px">You're all set — log in to continue using Civic Ledger.</p>
      <a class="btn btn-primary" href="/login.html" style="display:inline-block;min-width:180px">Go to log in →</a>`;
    content.style.opacity = '1';
    content.style.transform = 'scale(1)';
  }, 300);
}

/* ── Form submit ── */
const alertSlot = document.getElementById('alert-slot');
document.getElementById('verify-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const code = getCode();
  if (code.length < 6) {
    shakeBoxes();
    alertSlot.innerHTML = `<div class="alert alert-error">Please enter all 6 digits.</div>`;
    return;
  }
  const btn = document.getElementById('verify-btn');
  setButtonBusy(btn, true, 'Verifying');
  alertSlot.innerHTML = '';
  try {
    await api('POST', '/auth/verify-email', { email: emailField.value.trim(), code });
    showVerified();
  } catch (err) {
    alertSlot.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    shakeBoxes();
    setButtonBusy(btn, false);
  }
});

/* ── Token auto-verify ── */
if (token) api('GET', `/auth/verify-email?token=${encodeURIComponent(token)}`).then(showVerified).catch(() => {});

/* ── Auto-focus first box ── */
boxes[0].focus();
</script>
</body>
</html>
