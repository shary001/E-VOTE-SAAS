<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in — Civic Ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* ---------------------------------------------------------------- Ambient Floating Orbs */
  .login-stage {
    position: relative;
    max-width: 460px;
    margin: 0 auto;
    padding-top: 36px;
    z-index: 1;
  }
  .ambient-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(55px);
    pointer-events: none;
    z-index: -1;
    opacity: 0.55;
    animation: orb-drift 10s ease-in-out infinite alternate;
  }
  .orb-purple {
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, #A855F7 0%, #7E22CE 70%);
    top: 0;
    left: -40px;
    animation-duration: 9s;
  }
  .orb-cyan {
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, #38BDF8 0%, #0284C7 70%);
    bottom: 20px;
    right: -40px;
    animation-duration: 12s;
    animation-delay: -3s;
  }
  @keyframes orb-drift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(25px, -20px) scale(1.12); }
    100% { transform: translate(-20px, 20px) scale(0.92); }
  }

  /* ---------------------------------------------------------------- Glass Card Levitation & Sheen */
  .login-glass-card {
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(32px) saturate(200%);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 26px;
    padding: 38px 34px;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.65),
      0 0 40px rgba(168, 85, 247, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    position: relative;
    overflow: hidden;
    animation: glass-entrance 480ms cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: transform 220ms ease, box-shadow 220ms ease;
  }
  .login-glass-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .login-glass-card:hover {
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.75),
      0 0 50px rgba(168, 85, 247, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.38);
  }
  @keyframes glass-entrance {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Error Shake Animation */
  .shake-card {
    animation: card-shake 420ms cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes card-shake {
    10%, 90% { transform: translate3d(-3px, 0, 0); }
    20%, 80% { transform: translate3d(5px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
    40%, 60% { transform: translate3d(6px, 0, 0); }
  }

  /* ---------------------------------------------------------------- Interactive Inputs & Eye Toggle */
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-wrap input {
    padding-right: 44px;
  }
  .pw-toggle-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 140ms ease, transform 140ms ease;
  }
  .pw-toggle-btn:hover {
    color: var(--text-white);
    transform: scale(1.1);
  }
  .caps-warning {
    display: none;
    font-size: 0.76rem;
    color: #FCD34D;
    margin-top: 6px;
    font-weight: 600;
  }

  /* ---------------------------------------------------------------- Quick Demo Role Pills */
  .demo-chips {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .demo-chip {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: var(--radius-full);
    padding: 5px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 140ms ease;
  }
  .demo-chip:hover {
    background: rgba(168, 85, 247, 0.2);
    border-color: var(--neon-purple);
    color: var(--text-white);
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.35);
    transform: translateY(-1px);
  }
  .demo-chip:active {
    transform: translateY(0);
  }
</style>
</head>
<body>
<div id="topbar-root"></div>

<main class="shell login-stage">
  <!-- Glowing Ambient Background Orbs -->
  <div class="ambient-orb orb-purple"></div>
  <div class="ambient-orb orb-cyan"></div>

  <!-- Floating Glassmorphic Login Window -->
  <div class="login-glass-card" id="card-box">
    <!-- Window Control Bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:10px;height:10px;border-radius:50%;background:#FF5F56;display:inline-block;box-shadow:0 0 8px rgba(255,95,86,0.6)"></span>
        <span style="width:10px;height:10px;border-radius:50%;background:#FFBD2E;display:inline-block;box-shadow:0 0 8px rgba(255,189,46,0.6)"></span>
        <span style="width:10px;height:10px;border-radius:50%;background:#27C93F;display:inline-block;box-shadow:0 0 8px rgba(39,201,63,0.6)"></span>
        <span class="meta" style="margin-left:8px;font-size:0.75rem;font-weight:700;letter-spacing:0.08em;color:var(--neon-purple)">CIVIC TRUST SECURE PORTAL</span>
      </div>
      <span class="badge badge-open" style="font-size:0.7rem;padding:2px 8px">v2.0 SSL</span>
    </div>

    <h1 style="font-size:1.9rem;margin-bottom:6px">Welcome back</h1>
    <p class="meta" style="margin-bottom:22px">Enter your institutional credentials to authenticate.</p>

    <div id="alert-slot"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Institutional Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="name@institution.edu">
      </div>

      <div class="field">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label for="password" style="margin-bottom:0">Password</label>
          <a href="/forgot-password.html" style="font-size:0.8rem;color:var(--neon-cyan)">Forgot?</a>
        </div>
        <div class="input-wrap">
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="pw-toggle-btn" id="toggle-pw-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="caps-warning" id="caps-warning">⚠️ Caps Lock is active</div>
      </div>

      <button class="btn btn-primary btn-block" type="submit" style="margin-top:10px;padding:12px;font-size:0.98rem">
        Authenticate &rarr;
      </button>
    </form>

    <!-- Quick Role Autofill (Convenience Helper) -->
    <div style="margin-top:24px;padding-top:18px;border-top:1px solid var(--glass-border)">
      <div class="meta" style="font-size:0.76rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim)">
        ⚡ Quick Fill Demo Roles
      </div>
      <div class="demo-chips">
        <button type="button" class="demo-chip" data-email="superadmin@example.com" data-pw="ChangeMe123!">
          Platform Admin
        </button>
        <button type="button" class="demo-chip" id="demo-clean-btn">
          Clear
        </button>
      </div>
    </div>

    <div style="margin-top:20px;text-align:center;font-size:0.88rem;color:var(--text-muted)">
      Don't have an account yet? <a href="/register.html" style="color:var(--neon-cyan);font-weight:600">Register new account</a>
    </div>

    <p class="meta" id="resend-wrap" style="display:none;margin-top:14px;text-align:center">
      Unverified account? <a href="#" id="resend-link" style="color:var(--neon-purple);font-weight:600">Resend verification code</a>
    </p>
  </div>
</main>

<script src="/js/app.js"></script>
<script>
renderTopbar();

const form = document.getElementById("login-form");
const alertSlot = document.getElementById("alert-slot");
const cardBox = document.getElementById("card-box");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const togglePwBtn = document.getElementById("toggle-pw-btn");
const eyeIcon = document.getElementById("eye-icon");
const capsWarning = document.getElementById("caps-warning");
let lastEmail = "";

// Password Visibility Toggle
togglePwBtn.addEventListener("click", () => {
  const isText = passwordInput.type === "text";
  passwordInput.type = isText ? "password" : "text";
  eyeIcon.innerHTML = isText
    ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`
    : `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
});

// Caps Lock Detection
passwordInput.addEventListener("keyup", (e) => {
  capsWarning.style.display = e.getModifierState && e.getModifierState("CapsLock") ? "block" : "none";
});

// Quick-Fill Demo Chips
document.querySelectorAll(".demo-chip[data-email]").forEach(chip => {
  chip.addEventListener("click", () => {
    emailInput.value = chip.dataset.email;
    passwordInput.value = chip.dataset.pw;
    emailInput.focus();
    cardBox.style.boxShadow = "0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(168,85,247,0.4), inset 0 1px 0 rgba(255,255,255,0.4)";
    setTimeout(() => {
      cardBox.style.boxShadow = "";
    }, 600);
  });
});
document.getElementById("demo-clean-btn").addEventListener("click", () => {
  emailInput.value = "";
  passwordInput.value = "";
  emailInput.focus();
});

// Submit Form Handler with Haptic Shake Feedback
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const submitBtn = form.querySelector("button[type=submit]");
  alertSlot.innerHTML = "";
  document.getElementById("resend-wrap").style.display = "none";
  lastEmail = emailInput.value.trim();
  const password = passwordInput.value;

  setButtonBusy(submitBtn, true, "Authenticating…");
  try {
    const { token, user } = await api("POST", "/auth/login", { email: lastEmail, password });
    saveSession(token, user);
    const dest = user.role === "super_admin" ? "/superadmin/dashboard.html"
               : user.role === "org_admin" ? "/orgadmin/dashboard.html"
               : "/voter/elections.html";
    window.location.href = dest;
  } catch (err) {
    // Trigger card shake animation
    cardBox.classList.remove("shake-card");
    void cardBox.offsetWidth; // force reflow
    cardBox.classList.add("shake-card");

    alertSlot.innerHTML = `<div class="alert alert-error" style="box-shadow:0 0 15px rgba(239,68,68,0.25)">${escapeHtml(err.message)}</div>`;
    if (err.body?.unverified) document.getElementById("resend-wrap").style.display = "block";
  } finally {
    setButtonBusy(submitBtn, false);
  }
});

// Resend Verification Link
document.getElementById("resend-link").addEventListener("click", async (e) => {
  e.preventDefault();
  await api("POST", "/auth/resend-verification", { email: lastEmail });
  alertSlot.innerHTML = `<div class="alert alert-success">If that account exists, a new verification link is on its way.</div>`;
});
</script>
</body>
</html>
