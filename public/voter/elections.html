<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elections — Civic Ledger</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .voter-election-card {
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 18px;
    background: var(--glass-bg-card);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-shadow);
    transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .voter-election-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--glass-shadow-hover);
    border-color: var(--glass-border-hover);
  }
  .voter-election-card.urgent {
    border-left: 4px solid var(--neon-purple);
    box-shadow: var(--glass-shadow), 0 0 25px rgba(168, 85, 247, 0.25);
  }
  .voter-election-card.voted {
    border-left: 4px solid var(--neon-emerald);
    background: linear-gradient(to right, rgba(16, 185, 129, 0.12), var(--glass-bg-card));
  }
</style>
</head>
<body>
<div id="topbar-root"></div>

<main class="shell">
  <div class="page-head">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
        <span class="badge badge-approved"><span class="badge-dot"></span> Active Voter</span>
        <span class="meta" id="voter-name-pill"></span>
      </div>
      <h1>Available Elections</h1>
      <p class="meta">Review democratic contests, submit candidate applications, and cast your secret ballots.</p>
    </div>
  </div>

  <div id="alert-slot"></div>

  <!-- Filters & Search Toolbar -->
  <div class="page-head" style="margin-bottom:18px;margin-top:10px">
    <div class="tabs" style="margin-bottom:0;border:none">
      <button type="button" class="tab active" data-voter-filter="all">All Elections (<span id="count-all">0</span>)</button>
      <button type="button" class="tab" data-voter-filter="vote_ready">To Vote (<span id="count-ready">0</span>)</button>
      <button type="button" class="tab" data-voter-filter="applications">Applying (<span id="count-apply">0</span>)</button>
      <button type="button" class="tab" data-voter-filter="results">Results (<span id="count-results">0</span>)</button>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <input type="search" id="election-search" placeholder="Search elections or seats…" style="max-width:280px;padding:8px 14px;font-size:0.9rem">
    </div>
  </div>

  <div id="election-list">
    <div class="panel-plain text-center" style="padding:48px 0;color:var(--ink-400)">
      Loading your elections…
    </div>
  </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/ui.js"></script>
<script>
const user = requireSession(["member", "candidate"]);
renderTopbar("/voter/elections.html");

const alertSlot = document.getElementById("alert-slot");
const listEl = document.getElementById("election-list");
const namePill = document.getElementById("voter-name-pill");
if (namePill && user) {
  namePill.textContent = user.full_name;
}

let rawElections = [];
let currentFilter = "all";
let searchQuery = "";

async function load() {
  try {
    rawElections = await api("GET", "/elections/mine/list");

    const total = rawElections.length;
    const voteReady = rawElections.filter(e => e.status === "voting_open" && !e.i_have_voted).length;
    const applying = rawElections.filter(e => e.status === "accepting_applications").length;
    const results = rawElections.filter(e => e.status === "closed" && e.results_published).length;

    document.getElementById("count-all").textContent = total;
    document.getElementById("count-ready").textContent = voteReady;
    document.getElementById("count-apply").textContent = applying;
    document.getElementById("count-results").textContent = results;

    render();
  } catch (err) {
    alertSlot.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    listEl.innerHTML = `<div class="empty-state">Unable to load elections at this time.</div>`;
  }
}

function render() {
  const q = searchQuery.toLowerCase();
  const filtered = rawElections.filter(e => {
    if (currentFilter === "vote_ready" && (e.status !== "voting_open" || e.i_have_voted)) return false;
    if (currentFilter === "applications" && e.status !== "accepting_applications") return false;
    if (currentFilter === "results" && (!e.results_published || e.status !== "closed")) return false;

    if (q) {
      const title = (e.title || "").toLowerCase();
      const pos = (e.position_name || "").toLowerCase();
      if (!title.includes(q) && !pos.includes(q)) return false;
    }
    return true;
  });

  if (!filtered.length) {
    listEl.innerHTML = `
      <div class="empty-state" style="padding:40px 20px">
        <h3>No elections found</h3>
        <p class="meta" style="margin-top:6px">There are currently no elections matching this view or search filter.</p>
      </div>
    `;
    return;
  }

  listEl.innerHTML = filtered.map(e => {
    const isUrgent = e.status === "voting_open" && !e.i_have_voted;
    const isVoted = e.i_have_voted;

    return `
      <div class="voter-election-card ${isUrgent ? 'urgent' : ''} ${isVoted ? 'voted' : ''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap">
          <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <span class="badge badge-${badgeFor(e)}">
                ${badgeIcon(e)} ${labelFor(e)}
              </span>
              <span class="meta">${escapeHtml(e.position_name)}</span>
            </div>
            <h2 style="font-size:1.35rem;margin:0 0 6px">${escapeHtml(e.title)}</h2>
            ${e.description ? `<p style="margin:0 0 10px;font-size:0.92rem;color:var(--ink-600);max-width:620px">${escapeHtml(e.description)}</p>` : ""}
          </div>
          <div style="text-align:right;flex-shrink:0">
            ${actionsFor(e)}
          </div>
        </div>

        <hr class="divider" style="margin:14px 0 10px">

        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.84rem" class="meta">
          <div>
            ${timelineSummary(e)}
          </div>
          <div>
            ${e.my_application_status ? `Your Application: <strong>${e.my_application_status}</strong>` : ""}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function labelFor(e) {
  if (e.status === "accepting_applications") return "Accepting Candidates";
  if (e.status === "voting_open") return e.i_have_voted ? "Ballot Submitted" : "Voting Is Open";
  if (e.status === "closed") return e.results_published ? "Results Published" : "Voting Concluded";
  return e.status;
}

function badgeFor(e) {
  if (e.status === "voting_open") return e.i_have_voted ? "approved" : "open";
  if (e.status === "closed") return e.results_published ? "approved" : "closed";
  return "pending";
}

function badgeIcon(e) {
  if (e.status === "voting_open" && !e.i_have_voted) return "🗳️";
  if (e.i_have_voted) return "✓";
  if (e.status === "closed" && e.results_published) return "🏆";
  return "📋";
}

function actionsFor(e) {
  const parts = [];
  if (e.status === "accepting_applications") {
    if (e.my_application_status) {
      parts.push(`<span class="badge badge-approved" style="padding:6px 12px">Application: ${e.my_application_status}</span>`);
    } else {
      parts.push(`<a class="btn btn-sm btn-primary" href="/voter/apply.html?id=${e.id}">Apply to Run &rarr;</a>`);
    }
  }

  if (e.status === "voting_open") {
    if (!e.i_have_voted) {
      parts.push(`<a class="btn btn-gold" href="/voter/ballot.html?id=${e.id}">Cast Secret Ballot &rarr;</a>`);
    } else {
      parts.push(`<span class="badge badge-approved" style="padding:6px 12px">✓ Ballot Cast</span>`);
    }
  }

  if (e.status === "closed" && e.results_published) {
    parts.push(`<a class="btn btn-sm btn-ghost" href="/results.html?id=${e.id}">View Results &rarr;</a>`);
  }

  return parts.join(" ") || `<span class="meta">Awaiting stage update</span>`;
}

function timelineSummary(e) {
  if (e.status === "accepting_applications") {
    return `Applications close: <strong>${fmtDate(e.application_close_at)}</strong> (${fmtTimeAgo(e.application_close_at)})`;
  }
  if (e.status === "voting_open") {
    return `Voting closes: <strong>${fmtDate(e.voting_close_at)}</strong> (${fmtTimeAgo(e.voting_close_at)})`;
  }
  return `Concluded: ${fmtDate(e.voting_close_at)}`;
}

// Tab filtering
document.querySelectorAll("[data-voter-filter]").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll("[data-voter-filter]").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentFilter = tab.dataset.voterFilter;
    render();
  });
});

// Search input
document.getElementById("election-search").addEventListener("input", (e) => {
  searchQuery = e.target.value.trim();
  render();
});

load();
</script>
</body>
</html>
